name: iOS

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Githulu.xcodeproj -scheme Githulu
      - name: Build and test
        run: >
          xcodebuild test
          -project Githulu.xcodeproj
          -scheme Githulu
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
          CODE_SIGNING_ALLOWED=NO
