name: iOS

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Githulu.xcodeproj -scheme Githulu
      - name: Build and test
        run: >
          xcodebuild test
          -project Githulu.xcodeproj
          -scheme Githulu
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
          -resultBundlePath "$RUNNER_TEMP/Githulu-tests.xcresult"
          CODE_SIGNING_ALLOWED=NO

      - name: Print test failure summary
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Githulu-tests.xcresult" || true
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/Githulu-tests.xcresult" || true

      - name: Upload Xcode test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Githulu-test-results
          path: ${{ runner.temp }}/Githulu-tests.xcresult
          if-no-files-found: warn
          retention-days: 7
