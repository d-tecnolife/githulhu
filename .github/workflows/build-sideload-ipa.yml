name: Build Sideload IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build unsigned IPA for AltStore
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GITHULHU_CLIENT_ID: ${{ vars.GITHULHU_CLIENT_ID || vars.GITHULU_CLIENT_ID }}
      GITHULHU_CLIENT_SECRET: ${{ secrets.GITHULHU_CLIENT_SECRET || secrets.GITHULU_CLIENT_SECRET }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Githulhu.xcodeproj
          -scheme Githulhu

      - name: Archive device build without code signing
        run: |
          if [ -z "$GITHULHU_CLIENT_ID" ]; then
            echo "::error::Set the GITHULHU_CLIENT_ID Actions repository variable before building an IPA."
            exit 1
          fi
          if [ -z "$GITHULHU_CLIENT_SECRET" ]; then
            echo "::error::Set the GITHULHU_CLIENT_SECRET Actions repository secret before building an IPA."
            exit 1
          fi
          xcodebuild archive \
            -project Githulhu.xcodeproj \
            -scheme Githulhu \
            -configuration Debug \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Githulhu.xcarchive" \
            GITHUB_CLIENT_ID="$GITHULHU_CLIENT_ID" \
            GITHUB_CLIENT_SECRET="$GITHULHU_CLIENT_SECRET" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Githulhu.xcarchive/Products/Applications/Githulhu.app" "$RUNNER_TEMP/ipa/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/Githulhu-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Githulhu-unsigned-ipa
          path: ${{ runner.temp }}/Githulhu-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
