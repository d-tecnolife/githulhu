name: Build Sideload IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build unsigned IPA for AltStore
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Githulu.xcodeproj
          -scheme Githulu

      - name: Archive device build without code signing
        run: >
          xcodebuild archive
          -project Githulu.xcodeproj
          -scheme Githulu
          -configuration Debug
          -sdk iphoneos
          -archivePath "$RUNNER_TEMP/Githulu.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Githulu.xcarchive/Products/Applications/Githulu.app" "$RUNNER_TEMP/ipa/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/Githulu-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Githulu-unsigned-ipa
          path: ${{ runner.temp }}/Githulu-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
