name: Githulhu
options:
  bundleIdPrefix: com.githulhu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
packages:
  libgit2:
    url: https://github.com/ibrahimcetin/libgit2.git
    exactVersion: 1.9.2
targets:
  Githulhu:
    type: application
    platform: iOS
    sources:
      - Githulhu
    dependencies:
      - package: libgit2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.githulhu.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/Githulhu-Info.plist
        GITHUB_CLIENT_ID: ""
        GITHUB_CLIENT_SECRET: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GithulhuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GithulhuTests
    dependencies:
      - target: Githulhu
  GithulhuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GithulhuUITests
    dependencies:
      - target: Githulhu
schemes:
  Githulhu:
    build:
      targets:
        Githulhu: all
        GithulhuTests: [test]
    test:
      targets:
        - GithulhuTests
        - GithulhuUITests
