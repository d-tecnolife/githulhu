name: Githulu
options:
  bundleIdPrefix: com.githulu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
packages:
  libgit2:
    url: https://github.com/ibrahimcetin/libgit2.git
    exactVersion: 1.9.2
targets:
  Githulu:
    type: application
    platform: iOS
    sources:
      - Githulu
    dependencies:
      - package: libgit2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.githulu.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/Githulu-Info.plist
        GITHUB_CLIENT_ID: ""
        GITHUB_CLIENT_SECRET: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GithuluTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GithuluTests
    dependencies:
      - target: Githulu
  GithuluUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GithuluUITests
    dependencies:
      - target: Githulu
schemes:
  Githulu:
    build:
      targets:
        Githulu: all
        GithuluTests: [test]
    test:
      targets:
        - GithuluTests
        - GithuluUITests
